name: Public video health

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: npm run plan:verify
      - run: npm run check
      - run: npm run content:check
      - run: npm run test:coverage
      - run: npm run build:review
        if: ${{ !cancelled() }}
      - run: npm run brand:verify
        if: ${{ !cancelled() }}
      - run: npm run verify:review-artifact
        if: ${{ !cancelled() }}
      # Keep the known legacy formatting gate visible after functional checks.
      - run: npm run format:check
        if: ${{ !cancelled() }}

  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Check public video and source health
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run video:health
      - name: Upload redacted health artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-video-health
          path: artifacts/public-video-health.v2.json
          if-no-files-found: error
          retention-days: 30
