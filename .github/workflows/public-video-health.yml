name: Public video health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: public-video-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Live publisher/API availability is operational evidence, not a PR test.
  # Deterministic monitor tests run with the full suite in ci.yml.
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Restore previous ledger from the same branch and workflow
        id: ledger
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { data } = await github.rest.actions.listArtifactsForRepo({
              ...context.repo, name: 'public-video-health-ledger', per_page: 100
            });
            const candidates = data.artifacts.filter(a => !a.expired &&
              a.workflow_run?.head_branch === context.ref.replace('refs/heads/', '') &&
              a.workflow_run?.id !== context.runId &&
              a.workflow_run?.head_repository_id === context.payload.repository.id
            ).sort((a, b) => b.id - a.id);
            for (const artifact of candidates) {
              const { data: run } = await github.rest.actions.getWorkflowRun({
                ...context.repo, run_id: artifact.workflow_run.id
              });
              if (run.path !== '.github/workflows/public-video-health.yml') continue;
              const archive = await github.rest.actions.downloadArtifact({
                ...context.repo, artifact_id: artifact.id, archive_format: 'zip'
              });
              fs.mkdirSync('artifacts', { recursive: true });
              fs.writeFileSync('artifacts/previous-health-ledger.zip', Buffer.from(archive.data));
              core.setOutput('restored', 'true');
              core.info(`Restoring ledger artifact ${artifact.id}; run ${run.id}`);
              return;
            }
            core.warning('No retained prior ledger found; this run creates an explicit new baseline.');
      - name: Read the single ledger file without extracting archive paths
        if: steps.ledger.outputs.restored == 'true'
        run: unzip -p artifacts/previous-health-ledger.zip public-video-health-ledger.v1.json > artifacts/public-video-health-ledger.v1.json
      - name: Check public video and source health
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run video:health
      - name: Upload redacted health artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-video-health
          path: |
            artifacts/public-video-health.v2.json
            artifacts/public-video-inventory.v1.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve operational ledger even when health is degraded
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-video-health-ledger
          path: artifacts/public-video-health-ledger.v1.json
          if-no-files-found: error
          retention-days: 90
