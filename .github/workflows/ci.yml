name: Contributor checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contributor-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Chinese fonts for share-image rendering
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm ci
      - name: Reject known high or critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - run: npm run plan:verify
      - run: npm run check
      - run: npm run content:check
      - run: npm run test:unit
      - run: npm run build:review
      - run: npm run brand:verify
      - run: npm run verify:review-artifact
      - run: npm run demo:check
      - run: npm run demo:build

  public-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test actual public catalog UI with mocked external services
        run: npm run test:e2e:public -- --project=chromium --project=mobile-chromium e2e/catalog-200.spec.ts e2e/catalog-ux.spec.ts e2e/video-types.spec.ts e2e/contributions.spec.ts e2e/video-player.spec.ts e2e/discovery-quality.spec.ts e2e/learning-quality.spec.ts
      - name: Measure public preview performance and accessibility
        run: ATLAS_LIGHTHOUSE_MODE=public-preview npm run test:lighthouse
      - name: Preserve mode, commit and tested/skipped evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-ui-verification
          path: |
            artifacts/public-preview/PREVIEW_ONLY.json
            artifacts/lighthouse-public-preview.json
            test-results/
          retention-days: 30
