name: Contributor checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contributor-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Chinese fonts for share-image rendering
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm ci
      - run: npm run plan:verify
      - run: npm run check
      - run: npm run content:check
      - run: npm run test:unit
      - run: npm run build:review
      - run: npm run brand:verify
      - run: npm run verify:review-artifact
      - run: npm run demo:check
      - run: npm run demo:build
